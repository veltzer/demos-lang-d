# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "scripts"]

[processor.pylint]
src_dirs = ["src", "scripts"]

[processor.mypy]
src_dirs = ["src", "scripts"]

[processor.requirements]
src_dirs = ["src", "scripts"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "src"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# The Makefile compiled each src/**/*.d with `ldc2 -O3 x.d -of=x.elf`. The
# generator drives scripts/ldc2_build.py, which runs the same compile and sends
# the .o intermediate to the output dir (-od) rather than the source tree.
[processor.generator.d]
command = "scripts/ldc2_build.py"
src_dirs = ["src"]
src_extensions = [".d"]
output_dir = "out"
output_extension = "elf"
batch = false

# ldc2 (the LLVM D compiler) builds the demos.
[dependencies]
system = [
    "ldc",
]
