# rsconstruct build configuration for this repository.

[analyzer.python]

[processor.ruff]
src_dirs = ["src", "scripts"]

[processor.pylint]
src_dirs = ["src", "scripts"]

[processor.mypy]
src_dirs = ["src", "scripts"]

[processor.taplo]
src_dirs = ["."]

# The Makefile compiled each src/**/*.d with `ldc2 -O3 x.d -of=x.elf`. The
# generator drives scripts/ldc2_build.py, which runs the same compile and sends
# the .o intermediate to the output dir (-od) rather than the source tree.
[processor.generator.d]
command = "scripts/ldc2_build.py"
src_dirs = ["src"]
src_extensions = [".d"]
output_dir = "out"
output_extension = "elf"
batch = false

# ldc2 (the LLVM D compiler) builds the demos.
[dependencies]
system = [
    "ldc",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
