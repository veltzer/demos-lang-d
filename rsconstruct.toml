# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

[analyzer.python]

[processor.ruff]
src_dirs = ["src", "scripts"]

[processor.pylint]
src_dirs = ["src", "scripts"]

[processor.mypy]
src_dirs = ["src", "scripts"]

[processor.taplo]
src_dirs = ["."]

# The Makefile compiled each src/**/*.d with `ldc2 -O3 x.d -of=x.elf`. The
# generator drives scripts/ldc2_build.py, which runs the same compile and sends
# the .o intermediate to the output dir (-od) rather than the source tree.
[processor.generator.d]
command = "scripts/ldc2_build.py"
src_dirs = ["src"]
src_extensions = [".d"]
output_dir = "out"
output_extension = "elf"
batch = false

# ldc2 (the LLVM D compiler) builds the demos.
[dependencies]
system = [
    "ldc",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
